name: Build iOS IPA (AgTech ERP v1.3.5+19)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package Flutter iOS IPA (v1.3.5+19)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Run Flutter Unit & Security Tests
        working-directory: mobile_app
        run: flutter test

      - name: Build iOS Application (Release Unsigned v1.3.5+19)
        working-directory: mobile_app
        run: |
          flutter build ios --release --no-codesign --build-name=1.3.5 --build-number=19 --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}

      - name: Package Unsigned iOS IPA & SHA-256 Digest
        shell: bash
        run: |
          mkdir -p build_output
          cd mobile_app
          rm -rf Payload
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ../build_output/PlantBook-Mobile-ERP-v1.3.5-ios-unsigned.ipa Payload
          cd ../build_output
          shasum -a 256 PlantBook-Mobile-ERP-v1.3.5-ios-unsigned.ipa > PlantBook-Mobile-ERP-v1.3.5-ios-SHA256.txt

      - name: Upload iOS IPA Artifact (v1.3.5+19)
        uses: actions/upload-artifact@v4
        with:
          name: PlantBook-Mobile-ERP-v1.3.5-iOS-IPA
          path: build_output/PlantBook-Mobile-ERP-v1.3.5-ios*
          retention-days: 30
