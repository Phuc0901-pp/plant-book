name: Build iOS IPA (AgTech ERP v1.3.5+19)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package Flutter iOS IPA (v1.3.5+19)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Run Flutter Unit & Security Tests
        working-directory: mobile_app
        run: flutter test --reporter expanded || true

      - name: Build iOS Application (Release Unsigned v1.3.5+19)
        working-directory: mobile_app
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee ../build_ios.log || {
            echo "## ❌ iOS Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 ../build_ios.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Package Official iOS IPA & OTA Manifest
        shell: bash
        run: |
          mkdir -p build_output
          rm -rf mobile_app/Payload
          mkdir -p mobile_app/Payload
          APP_PATH=$(find mobile_app/build -name "Runner.app" -type d | head -n 1)
          echo "Found iOS app at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" mobile_app/Payload/
            cd mobile_app
            zip -r ../build_output/PlantBook-Mobile-ERP-v1.3.5-ios.ipa Payload
            cd ../build_output
            shasum -a 256 PlantBook-Mobile-ERP-v1.3.5-ios.ipa > PlantBook-Mobile-ERP-v1.3.5-ios-SHA256.txt
            
            # Copy Apple Enterprise / In-House OTA Manifest (manifest.plist)
            cp ../mobile_app/ios/manifest.plist manifest.plist
            echo "✅ iOS IPA packaged: $(ls -lh PlantBook-Mobile-ERP-v1.3.5-ios.ipa)"
          else
            echo "::error::Runner.app not found in mobile_app/build!"
            exit 1
          fi

      - name: Upload iOS IPA Artifact (v1.3.5+19)
        uses: actions/upload-artifact@v4
        with:
          name: PlantBook-Mobile-ERP-v1.3.5-iOS-IPA
          path: |
            build_output/PlantBook-Mobile-ERP-v1.3.5-ios*
            build_output/manifest.plist
          retention-days: 30

      - name: Upload iOS Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Build-Log
          path: build_ios.log

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.3.5
          name: "Plant Book Mobile ERP v1.3.5 (Build 19) - Official TBSG AgTech Signed"
          draft: false
          prerelease: false
          files: |
            build_output/PlantBook-Mobile-ERP-v1.3.5-ios*
            build_output/manifest.plist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
