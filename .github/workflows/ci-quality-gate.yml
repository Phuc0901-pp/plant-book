name: ISO 29119 Quality Gate & E2E Smoke Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  iso-qc-qa:
    name: Backend ISO/IEC 29119-3 & 25010 Master Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax Check Modular Backend & Frontend JS
        run: |
          node --check routes/plants.js
          for f in routes/plants/*.js; do node --check "$f"; done
          for f in ../frontend/public/js/plant*.js; do node --check "$f"; done

      - name: Run 24 ISO Test Suites (160+ Cases)
        run: npm run test:iso
