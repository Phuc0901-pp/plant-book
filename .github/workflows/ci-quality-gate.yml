name: ISO 29119 Quality Gate & E2E Smoke Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  iso-qc-qa:
    name: Backend ISO/IEC 29119-3 & 25010 Master Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax Check Modular Backend & Frontend JS
        run: |
          node --check server.js
          for f in routes/*.js routes/plants/*.js services/*.js middleware/*.js config/*.js utils/*.js db/*.js scripts/*.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
          for f in ../frontend/public/js/*.js; do node --check "$f"; done
          for f in ../frontend/admin/js/*.js; do node --check "$f"; done
          for f in ../frontend/assets/js/*.js; do node --check "$f"; done
          for f in ../frontend/user/sw.js ../frontend/user/js/*.js ../frontend/user/js/*/*.js; do node --check "$f"; done
          node scripts/build-html.js

      - name: Run All ISO Test Suites (26+ Suites)
        run: npm run test:iso
