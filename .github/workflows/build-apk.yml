name: Build Android APK (AgTech ERP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Fat Release APK (Universal)
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Build Split per ABI APKs (Optimized)
        working-directory: mobile_app
        run: flutter build apk --split-per-abi

      - name: Copy and Rename APKs
        run: |
          mkdir -p build_output
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build_output/PlantBook-Mobile-ERP-v1.2.0-universal.apk
          cp mobile_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build_output/PlantBook-Mobile-ERP-v1.2.0-arm64.apk 2>/dev/null || true
          cp mobile_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build_output/PlantBook-Mobile-ERP-v1.2.0-armv7.apk 2>/dev/null || true

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantBook-Mobile-ERP-APK
          path: build_output/
          retention-days: 30
