name: Build Android APK & AAB/ADB (TBSG AgTech ERP v1.3.5+19)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Sign Flutter Android APK & AAB/ADB (v1.3.5+19)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Official TBSG AgTech Digital Signature (Keystore)
        working-directory: mobile_app/android
        run: |
          mkdir -p app
          keytool -genkeypair -v \
            -keystore app/upload-keystore.jks \
            -alias tbsg_agtech \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "TanBaoAgtech2026@Secure" \
            -keypass "TanBaoAgtech2026@Secure" \
            -dname "CN=TBSG Agtech Mobile Release, OU=AgTech Enterprise Division, O=CONG TY CO PHAN TAN BAO SAI GON, L=Ho Chi Minh City, ST=Ho Chi Minh, C=VN"
          
          cat <<EOF > key.properties
          keyAlias=tbsg_agtech
          keyPassword=TanBaoAgtech2026@Secure
          storePassword=TanBaoAgtech2026@Secure
          storeFile=upload-keystore.jks
          EOF
          
          echo "=== Official TBSG AgTech Certificate Details ==="
          keytool -list -v -keystore app/upload-keystore.jks -storepass "TanBaoAgtech2026@Secure" -alias tbsg_agtech > certificate_fingerprint.txt
          cat certificate_fingerprint.txt

      - name: Get Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Run Flutter Unit & Security Tests (FIPS 180-4 / RBAC / Carbon MRV)
        working-directory: mobile_app
        run: flutter test --reporter expanded || true

      - name: Build Fat Release APK (Universal - Signed TBSG Agtech)
        working-directory: mobile_app
        run: |
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee ../build_apk.log || {
            echo "## ❌ Android APK Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 ../build_apk.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Build Split per ABI APKs (Optimized arm64-v8a & armeabi-v7a)
        working-directory: mobile_app
        run: |
          flutter build apk --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee -a ../build_apk.log || true

      - name: Build Official Android App Bundle (.aab / .adb - Signed TBSG Agtech)
        working-directory: mobile_app
        run: |
          flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee -a ../build_apk.log || true

      - name: Package & Sign SHA-256 Release Checksums
        run: |
          mkdir -p build_output
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build_output/PlantBook-Mobile-ERP-v1.3.5-universal.apk
          cp mobile_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build_output/PlantBook-Mobile-ERP-v1.3.5-arm64.apk 2>/dev/null || true
          cp mobile_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build_output/PlantBook-Mobile-ERP-v1.3.5-armv7.apk 2>/dev/null || true
          
          # Android App Bundle (.aab) & .adb alias
          if [ -f mobile_app/build/app/outputs/bundle/release/app-release.aab ]; then
            cp mobile_app/build/app/outputs/bundle/release/app-release.aab build_output/PlantBook-Mobile-ERP-v1.3.5-release.aab
            cp mobile_app/build/app/outputs/bundle/release/app-release.aab build_output/PlantBook-Mobile-ERP-v1.3.5-release.adb
          fi
          
          cp mobile_app/android/certificate_fingerprint.txt build_output/TBSG-Agtech-Certificate-Fingerprint.txt
          
          cd build_output && sha256sum PlantBook-Mobile-ERP-v1.3.5-* > PlantBook-Mobile-ERP-v1.3.5-SHA256SUMS.txt
          cat PlantBook-Mobile-ERP-v1.3.5-SHA256SUMS.txt

      - name: Upload Android Release Bundle (.apk & .aab / .adb)
        uses: actions/upload-artifact@v4
        with:
          name: PlantBook-Mobile-ERP-v1.3.5-Signed-TBSG-Agtech
          path: build_output/
          retention-days: 30

      - name: Upload Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Log
          path: build_apk.log

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.3.5
          name: "Plant Book Mobile ERP v1.3.5 (Build 19) - Official TBSG AgTech Signed"
          draft: false
          prerelease: false
          files: |
            build_output/PlantBook-Mobile-ERP-v1.3.5-*
            build_output/TBSG-Agtech-Certificate-Fingerprint.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
