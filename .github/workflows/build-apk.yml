name: Build Android APK (AgTech ERP v1.3.5+19)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Verify Flutter Android APK (v1.3.5+19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Run Flutter Unit & Security Tests (FIPS 180-4 / RBAC / Carbon MRV)
        working-directory: mobile_app
        run: flutter test

      - name: Build Fat Release APK (Universal)
        working-directory: mobile_app
        run: flutter build apk --release --build-name=1.3.5 --build-number=19 --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Build Split per ABI APKs (Optimized arm64-v8a & armeabi-v7a)
        working-directory: mobile_app
        run: flutter build apk --split-per-abi --build-name=1.3.5 --build-number=19 --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Package & Sign SHA-256 Release Checksums
        run: |
          mkdir -p build_output
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build_output/PlantBook-Mobile-ERP-v1.3.5-universal.apk
          cp mobile_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build_output/PlantBook-Mobile-ERP-v1.3.5-arm64.apk 2>/dev/null || true
          cp mobile_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build_output/PlantBook-Mobile-ERP-v1.3.5-armv7.apk 2>/dev/null || true
          cd build_output && sha256sum PlantBook-Mobile-ERP-v1.3.5-*.apk > PlantBook-Mobile-ERP-v1.3.5-SHA256SUMS.txt

      - name: Upload Android APK Release Bundle (v1.3.5+19)
        uses: actions/upload-artifact@v4
        with:
          name: PlantBook-Mobile-ERP-v1.3.5-APK
          path: build_output/
          retention-days: 30
