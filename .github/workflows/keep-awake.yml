name: Keep Render App Awake (PROD & DEV)

on:
  schedule:
    # Chạy mỗi 10 phút (Render Free tier tự động ngủ sau 15 phút không hoạt động)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép chạy thủ công từ giao diện GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping requests to Render (PROD & DEV)
        run: |
          URLS=(
            "https://plant-book.onrender.com/api/health"
            "https://dev-plantbook.onrender.com/api/health"
            "https://dev.plantbook.onrender.com/api/health"
          )
          
          for URL in "${URLS[@]}"; do
            echo "----------------------------------------"
            echo "Pinging $URL..."
            response=$(curl -s -L -w "%{http_code}" -o /dev/null "$URL")
            if [ "$response" -eq 200 ]; then
              echo "[SUCCESS] Ping thành công! Dịch vụ $URL đang hoạt động mượt mà."
            else
              echo "[WARNING] Cảnh báo: Phản hồi từ máy chủ $URL nhận được mã $response."
            fi
          done
