    <div class="topbar">
      <div style="display:flex;align-items:center;">
        <button class="mobile-toggle-btn" onclick="toggleMobileSidebar()" style="display:none; background:#ffffff; border:1.5px solid #cbd5e1; color:#0f172a; border-radius:8px;">
          <i class="fa fa-bars"></i>
        </button>
        <h1 id="page-title"><i class="fa-solid fa-leaf" style="color:#059669; font-size:16px;"></i> Trang chủ</h1>
      </div>
      <div class="topbar-actions" id="topbar-actions" style="display:flex; align-items:center; gap:12px;">
        
        <!-- Autonomous In-App Notification Center Bell Button -->
        <div style="position:relative;">
          <button onclick="toggleNotificationDropdown()" title="Thông báo hệ thống" style="position:relative; background:#ffffff; border:1.5px solid #cbd5e1; border-radius:10px; width:38px; height:38px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:#334155; font-size:15px; box-shadow:0 1px 2px rgba(0,0,0,0.05); transition:all 0.2s;">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge" style="display:none; position:absolute; top:-4px; right:-4px; background:#ef4444; color:white; font-size:10px; font-weight:800; border-radius:10px; padding:2px 6px; border:2px solid #ffffff;">0</span>
          </button>

          <!-- Translucent Overlay Backdrop for Mobile/Desktop -->
          <div id="notif-overlay" onclick="closeNotificationDropdown()"></div>

          <!-- Notification Dropdown Panel / Mobile Centered Modal -->
          <div id="notif-dropdown" class="notif-panel">
            <div style="padding:14px 16px; background:#ffffff; border-bottom:1.5px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
              <strong style="font-size:14px; color:#0f172a; display:flex; align-items:center; gap:6px;">
                <i class="fa-solid fa-bell" style="color:#059669;"></i> Thông Báo Hệ Thống Nông Hộ
              </strong>
              <div style="display:flex; align-items:center; gap:10px;">
                <button onclick="markAllNotificationsRead()" style="background:#f1f5f9; border:1px solid #cbd5e1; color:#334155; font-size:11px; font-weight:700; cursor:pointer; border-radius:6px; padding:3px 8px;">Đã đọc hết</button>
                <button onclick="closeNotificationDropdown()" style="background:none; border:none; color:#64748b; font-size:20px; font-weight:800; cursor:pointer; line-height:1; padding:0 4px;">×</button>
              </div>
            </div>
            <div id="notif-list" style="overflow-y:auto; max-height:320px; padding:8px 12px; display:flex; flex-direction:column; gap:8px; background:#f8fafc;">
              <div style="text-align:center; padding:20px; color:#64748b; font-size:13px;"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải thông báo...</div>
            </div>
            <div style="padding:10px; background:#f8fafc; border-top:1px solid #e2e8f0; display:flex; flex-direction:column; gap:6px;">
              <div style="display:flex; gap:6px;">
                <button onclick="playCheerfulChime()" style="flex:1; background:#f0fdf4; border:1px solid #bbf7d0; color:#15803d; padding:6px 8px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:4px;">
                   Nhạc Khuyến cáo
                </button>
                <button onclick="playStrongAlert()" style="flex:1; background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:6px 8px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:4px;">
                   Chuông Cảnh báo
                </button>
              </div>
              <button onclick="requestWebPushPermission()" class="royal-pill-btn royal-pill-btn-primary" style="width:100%;">
                <i class="fa-solid fa-mobile-screen"></i> Bật Thông báo Đẩy màn hình
              </button>
            </div>
          </div>
        </div>

        <!-- PWA Offline / Online Sync Status Indicator -->
        <div id="offline-sync-wrap" style="display:inline-flex; align-items:center;">
          <button id="offline-sync-badge" onclick="if(typeof window.triggerOfflineSync==='function')window.triggerOfflineSync(true)" title="Trạng thái kết nối & Đồng bộ dữ liệu" style="background:#ecfdf5; border:1.5px solid #a7f3d0; border-radius:20px; padding:5px 10px; font-size:12px; font-weight:700; color:#059669; display:inline-flex; align-items:center; gap:5px; cursor:pointer; transition:all 0.2s ease; box-shadow:0 1px 2px rgba(0,0,0,0.03);">
            <span style="width:7px; height:7px; border-radius:50%; background:#10b981; display:inline-block; box-shadow:0 0 6px #10b981;"></span>
            <span id="sync-status-text" class="topbar-btn-text" style="color:#059669;">Trực tuyến</span>
          </button>
        </div>
      </div>
    </div>
