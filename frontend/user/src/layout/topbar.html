    <div class="topbar">
      <div style="display:flex;align-items:center;">
        <button class="mobile-toggle-btn" onclick="toggleMobileSidebar()" style="display:none; background:#ffffff; border:1.5px solid #cbd5e1; color:#0f172a; border-radius:8px;">
          <i data-lucide="menu" class="lucide-sm"></i>
        </button>
        <h1 id="page-title"><i data-lucide="leaf" class="lucide-sm" style="color:#059669; font-size:16px;"></i> Trang chủ</h1>
      </div>
      <div class="topbar-actions" id="topbar-actions" style="display:flex; align-items:center; gap:12px;">
        
        <!-- Autonomous In-App Notification Center Bell Button -->
        <div style="position:relative;">
          <button onclick="toggleNotificationDropdown()" title="Thông báo hệ thống" style="position:relative; background:#ffffff; border:1.5px solid #cbd5e1; border-radius:10px; width:38px; height:38px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:#334155; font-size:15px; box-shadow:0 1px 2px rgba(0,0,0,0.05); transition:all 0.2s;">
            <i data-lucide="bell" class="lucide-sm"></i>
            <span id="notif-badge" style="display:none; position:absolute; top:-4px; right:-4px; background:#ef4444; color:white; font-size:10px; font-weight:800; border-radius:10px; padding:2px 6px; border:2px solid #ffffff;">0</span>
          </button>

          <!-- Translucent Overlay Backdrop for Mobile/Desktop -->
          <div id="notif-overlay" onclick="closeNotificationDropdown()"></div>

          <!-- Notification Dropdown Panel / Mobile Centered Modal -->
          <div id="notif-dropdown" class="notif-panel" style="display:none; width:380px; max-width:92vw; border-radius:18px; box-shadow:0 12px 36px rgba(0,0,0,0.15); border:1px solid #cbd5e1; overflow:hidden;">
            <!-- Header -->
            <div style="padding:14px 16px; background:#ffffff; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
              <strong style="font-size:14px; color:#0f172a; display:flex; align-items:center; gap:8px; font-weight:800;">
                <span style="width:28px; height:28px; border-radius:8px; background:#ecfdf5; display:flex; align-items:center; justify-content:center; color:#059669;">
                  <i data-lucide="bell" style="width:16px; height:16px;"></i>
                </span>
                Trung Tâm Thông Báo
              </strong>
              <div style="display:flex; align-items:center; gap:8px;">
                <button onclick="markAllNotificationsRead()" title="Đánh dấu tất cả là đã đọc" style="background:#f1f5f9; border:1px solid #cbd5e1; color:#334155; font-size:11.5px; font-weight:700; cursor:pointer; border-radius:8px; padding:4px 8px; display:inline-flex; align-items:center; gap:4px; transition:all 0.2s;" onmouseenter="this.style.background='#e2e8f0';" onmouseleave="this.style.background='#f1f5f9';">
                  <i data-lucide="check-check" style="width:13px; height:13px; color:#059669;"></i> Đã đọc hết
                </button>
                <button onclick="closeNotificationDropdown()" style="background:none; border:none; color:#64748b; font-size:20px; font-weight:800; cursor:pointer; line-height:1; padding:2px 6px; border-radius:6px;" onmouseenter="this.style.color='#0f172a'; this.style.background='#f1f5f9';" onmouseleave="this.style.color='#64748b'; this.style.background='transparent';">×</button>
              </div>
            </div>

            <!-- Filter Tabs Bar -->
            <div style="display:flex; background:#ffffff; padding:6px 12px; border-bottom:1px solid #f1f5f9; gap:6px;">
              <button onclick="filterNotifications('all')" class="notif-filter-tab active" data-filter="all" style="flex:1; padding:5px 8px; border-radius:8px; font-size:11.5px; font-weight:700; cursor:pointer; border:1px solid #e2e8f0; background:#f8fafc; color:#475569; transition:all 0.2s;">
                Tất cả
              </button>
              <button onclick="filterNotifications('unread')" class="notif-filter-tab" data-filter="unread" style="flex:1; padding:5px 8px; border-radius:8px; font-size:11.5px; font-weight:700; cursor:pointer; border:1px solid #e2e8f0; background:#f8fafc; color:#475569; transition:all 0.2s;">
                Chưa đọc
              </button>
              <button onclick="filterNotifications('danger')" class="notif-filter-tab" data-filter="danger" style="flex:1; padding:5px 8px; border-radius:8px; font-size:11.5px; font-weight:700; cursor:pointer; border:1px solid #e2e8f0; background:#f8fafc; color:#dc2626; transition:all 0.2s;">
                Cảnh báo
              </button>
            </div>

            <!-- List of Notification Items -->
            <div id="notif-list" style="overflow-y:auto; max-height:340px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; background:#f8fafc;">
              <div style="text-align:center; padding:20px; color:#64748b; font-size:13px;"><i data-lucide="loader-2" class="lucide-spin lucide-sm"></i> Đang tải thông báo...</div>
            </div>

            <!-- Footer: Sound Tests & Web Push Button -->
            <div style="padding:10px 14px; background:#ffffff; border-top:1px solid #e2e8f0; display:flex; flex-direction:column; gap:8px;">
              <div style="display:flex; gap:8px;">
                <button onclick="playCheerfulChime()" style="flex:1; background:#f0fdf4; border:1px solid #a7f3d0; color:#15803d; padding:6px 10px; border-radius:8px; font-size:11.5px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:5px; transition:all 0.2s;" onmouseenter="this.style.background='#dcfce7';" onmouseleave="this.style.background='#f0fdf4';">
                  <i data-lucide="music" style="width:13px; height:13px;"></i> Âm Khuyến Nghị
                </button>
                <button onclick="playStrongAlert()" style="flex:1; background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:6px 10px; border-radius:8px; font-size:11.5px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:5px; transition:all 0.2s;" onmouseenter="this.style.background='#fee2e2';" onmouseleave="this.style.background='#fef2f2';">
                  <i data-lucide="volume-2" style="width:13px; height:13px;"></i> Còi Báo Động
                </button>
              </div>
              <button onclick="requestWebPushPermission()" class="royal-pill-btn royal-pill-btn-primary" style="width:100%; padding:9px 14px; font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:6px;">
                <i data-lucide="smartphone" style="width:15px; height:15px;"></i> Bật Thông Báo Đẩy Màn Hình
              </button>
            </div>
          </div>
        </div>

        <!-- PWA Offline / Online Sync Status Indicator -->
        <div id="offline-sync-wrap" style="display:inline-flex; align-items:center;">
          <button id="offline-sync-badge" onclick="if(typeof window.triggerOfflineSync==='function')window.triggerOfflineSync(true)" title="Trạng thái kết nối & Đồng bộ dữ liệu" style="background:#ecfdf5; border:1.5px solid #a7f3d0; border-radius:20px; padding:5px 10px; font-size:12px; font-weight:700; color:#059669; display:inline-flex; align-items:center; gap:5px; cursor:pointer; transition:all 0.2s ease; box-shadow:0 1px 2px rgba(0,0,0,0.03);">
            <span style="width:7px; height:7px; border-radius:50%; background:#10b981; display:inline-block; box-shadow:0 0 6px #10b981;"></span>
            <span id="sync-status-text" class="topbar-btn-text" style="color:#059669;">Trực tuyến</span>
          </button>
        </div>
      </div>
    </div>
