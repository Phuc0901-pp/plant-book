<!-- Scripts (ES Modules) -->
<script src="/assets/js/lucide-auto-hydrator.js?v={{APP_VERSION}}"></script>
<script>
  window.refreshIcons = window.refreshIcons || function() {
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  };
  // Inline fallbacks to ensure login buttons work immediately even before ES module evaluation
  window.doLogin = window.doLogin || async function() {
    const email = document.getElementById('login-email')?.value.trim();
    const pass  = document.getElementById('login-pass')?.value;
    const errEl = document.getElementById('login-error');
    const btn   = document.getElementById('login-btn');
    if (errEl) errEl.style.display = 'none';
    if (btn)   { btn.innerHTML = '<span class="spinner"></span> Đang đăng nhập...'; btn.disabled = true; }
    try {
      const res  = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password: pass })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Đăng nhập thất bại');
      if (data.user && data.user.role === 'admin') {
        localStorage.setItem('pb_token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        if (btn) btn.innerHTML = '<span class="spinner"></span> Đang chuyển hướng Quản trị...';
        window.location.href = '/admin';
        return;
      }
      localStorage.setItem('pb_token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.reload();
    } catch (err) {
      if (errEl) {
        const errText = document.getElementById('login-error-text');
        if (errText) errText.textContent = err.message;
        else errEl.textContent = err.message;
        errEl.style.display = 'flex';
      }
      if (btn) {
        btn.innerHTML = '<span id="login-btn-text"><i data-lucide="log-in" class="lucide-sm"></i> Đăng nhập</span>';
        btn.disabled = false;
        if (window.refreshIcons) window.refreshIcons();
      }
    }
  };
  window.togglePasswordVisibility = window.togglePasswordVisibility || function() {
    const passInput = document.getElementById('login-pass');
    const icon = document.getElementById('toggle-pass-icon');
    if (!passInput || !icon) return;
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    icon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
    if (window.lucide) lucide.createIcons({ targets: [icon.parentElement || icon] });
  };
  window.toggleSettingsPw = window.toggleSettingsPw || function(btn) {
    const inp = btn.previousElementSibling;
    if (!inp) return;
    const isPass = inp.type === 'password';
    inp.type = isPass ? 'text' : 'password';
    const icon = btn.querySelector('[data-lucide]') || btn.querySelector('svg');
    if (icon) {
      icon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
      if (window.lucide) lucide.createIcons({ targets: [btn] });
    }
  };
  window.openRegisterModal = window.openRegisterModal || function() {
    const modal = document.getElementById('register-modal');
    if (modal) modal.style.display = 'flex';
  };
  window.closeRegisterModal = window.closeRegisterModal || function() {
    const modal = document.getElementById('register-modal');
    if (modal) modal.style.display = 'none';
  };
  window.openForgotPasswordModal = window.openForgotPasswordModal || function() {
    const modal = document.getElementById('forgot-modal');
    if (modal) modal.style.display = 'flex';
  };
  window.closeForgotPasswordModal = window.closeForgotPasswordModal || function() {
    const modal = document.getElementById('forgot-modal');
    if (modal) modal.style.display = 'none';
  };
</script>
<!-- Tesseract.js for Real-Time Client-Side Agricultural Packaging OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- auth.js phải load trước để xử lý token check khi tải trang -->
<script type="module" src="/user/js/auth.js?v={{APP_VERSION}}"></script>

<!-- app.js là entry point: import tất cả module và expose lên window -->
<script type="module" src="/user/js/app.js?v={{APP_VERSION}}"></script>
</body>
</html>
