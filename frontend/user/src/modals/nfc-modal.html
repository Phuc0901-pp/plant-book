  <!-- ── NFC TAG MODAL ── -->
  <div id="nfc-modal" class="modal-overlay">
    <div class="modal-box nfc-modal-box" style="max-height: 90vh; max-height: 90dvh; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; padding: 20px 18px;">
      <!-- Header -->
      <div class="nfc-modal-header" style="position: sticky; top: -20px; background: #ffffff; padding: 6px 0; margin-bottom: 14px; z-index: 10; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 12px;">
        <div class="nfc-modal-icon-ring" style="width: 42px; height: 42px; font-size: 18px;">
          <i class="fa-solid fa-tag"></i>
        </div>
        <div style="flex: 1; min-width: 0;">
          <h2 class="nfc-modal-title" style="font-size: 16px;">Định danh Thẻ NFC</h2>
          <p class="nfc-modal-subtitle">Cây: <strong id="nfc-modal-plant-name">...</strong></p>
        </div>
        <button class="modal-close-btn" onclick="closeNfcModal()" aria-label="Đóng" style="width: 32px; height: 32px; font-size: 20px; flex-shrink: 0;">×</button>
      </div>

      <!-- Current UID -->
      <div class="nfc-current-uid-row" style="margin-bottom: 14px; padding: 8px 12px;">
        <span class="nfc-uid-label"><i class="fa-solid fa-id-card"></i> Thẻ hiện tại:</span>
        <span id="nfc-modal-current-uid"></span>
      </div>

      <!-- Hierarchical Public Plant URL Box: domain / <farm_id> / <plant_id> / <nfc_uid> -->
      <div id="nfc-public-url-wrap" style="margin: 10px 0 14px; padding: 12px; background: #f0fdf4; border: 1.5px solid #86efac; border-radius: 12px;">
        <div style="font-size: 11px; font-weight: 700; color: #166534; text-transform: uppercase; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px;">
          <span><i class="fa-solid fa-link"></i> Đường dẫn Trang Cây Công khai chuẩn:</span>
          <span style="font-size: 10px; color: #15803d; background: #dcfce7; padding: 2px 8px; border-radius: 6px; font-weight:700;">Liên kết ghi vào thẻ NFC</span>
        </div>
        
        <!-- URL Input & Buttons -->
        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
          <input type="text" id="nfc-public-url-input" readonly style="flex: 1; min-width: 0; padding: 8px 10px; font-size: 12px; font-family: monospace; background: #ffffff; border: 1px solid #94a3b8; border-radius: 8px; color: #0f172a; font-weight: 600;" value="...">
          <button class="btn btn-secondary btn-xs" onclick="copyNfcPublicUrl()" title="Sao chép link" style="white-space: nowrap; padding: 6px 10px; font-size: 12px; height:34px; border-radius: 8px;">
            <i class="fa-regular fa-copy"></i> Copy
          </button>
          <a id="nfc-public-url-link" href="#" target="_blank" class="btn btn-primary btn-xs" title="Mở trang công khai" style="white-space: nowrap; padding: 6px 10px; font-size: 12px; text-decoration: none; height:34px; display:inline-flex; align-items:center; gap:4px; border-radius: 8px;">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Mở
          </a>
        </div>

        <!-- Component ID Parameters breakdown -->
        <div style="display:flex; gap:6px; flex-wrap:wrap; font-size:11px;">
          <span class="badge" style="background:#dcfce7; color:#14532d; font-weight:600;"><i class="fa-solid fa-warehouse"></i> ID Vườn: <strong id="nfc-meta-farm-id">#--</strong></span>
          <span class="badge" style="background:#dcfce7; color:#14532d; font-weight:600;"><i class="fa-solid fa-seedling"></i> ID Cây: <strong id="nfc-meta-plant-id">#--</strong></span>
          <span class="badge" style="background:#dcfce7; color:#14532d; font-weight:600;"><i class="fa-solid fa-tag"></i> ID Mã Thẻ: <strong id="nfc-meta-tag-id">Chưa gắn</strong></span>
        </div>
      </div>

      <!-- Scan Area -->
      <div class="nfc-scan-area" style="padding: 16px 14px; margin-bottom: 14px;">
        <div class="nfc-scan-icon-wrap" style="width: 48px; height: 48px; font-size: 22px;">
          <i id="nfc-scan-icon" class="fa-solid fa-wifi" style="color:#6b7280"></i>
        </div>
        <p id="nfc-scan-label" class="nfc-scan-label" style="font-size: 12.5px;">Nhấn "Bắt đầu quét" để chạm thẻ</p>
        <button id="nfc-start-scan-btn" class="btn btn-primary nfc-scan-btn" onclick="startNfcScan()" style="padding: 8px 16px; font-size: 13px;">
          <i class="fa-solid fa-rss"></i> Bắt đầu quét NFC
        </button>
      </div>

      <!-- Divider -->
      <div class="nfc-divider" style="margin-bottom: 12px;"><span>hoặc nhập thủ công</span></div>

      <!-- Manual Input -->
      <div class="nfc-manual-section" style="margin-bottom: 14px;">
        <label class="nfc-input-label" style="font-size: 12px; margin-bottom: 6px;"><i class="fa-solid fa-keyboard"></i> Nhập mã thẻ (UID)</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="nfc-manual-uid" placeholder="Ví dụ: 04:AB:12:CD:EF:34" class="nfc-manual-input"
            onkeydown="if(event.key==='Enter') saveNfcUidManually()">
          <button class="btn btn-primary" onclick="saveNfcUidManually()" style="white-space:nowrap; padding: 8px 16px;">
            <i class="fa-solid fa-floppy-disk"></i> Lưu
          </button>
        </div>
        <p style="font-size:11px; color:var(--gray-400); margin-top:6px;">
          <i class="fa-solid fa-circle-info"></i> Mã UID thường được in trên mặt thẻ hoặc do phần mềm đọc thẻ cung cấp.
        </p>
      </div>

      <!-- Deactivate -->
      <button id="nfc-deactivate-btn" class="nfc-deactivate-btn" onclick="deactivateNfcTag()" style="display:none; padding: 8px 14px; font-size: 12.5px;">
        <i class="fa-solid fa-ban"></i> Hủy kích hoạt thẻ hiện tại
      </button>

      <!-- Footer -->
      <div class="nfc-modal-footer" style="padding-top: 10px; margin-top: 8px;">
        <button class="btn btn-secondary" onclick="closeNfcModal()" style="padding: 8px 18px; border-radius: 8px; font-weight: 700; font-size: 13px;">
          <i class="fa-solid fa-xmark"></i> Đóng
        </button>
      </div>
    </div>
  </div>

<!-- ════════════ CARE MODAL ════════════ -->
