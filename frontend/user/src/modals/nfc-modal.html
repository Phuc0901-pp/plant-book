  <!-- ── NFC TAG MODAL ── -->
  <div id="nfc-modal" class="modal-overlay">
    <div class="modal-box nfc-modal-box">
      <!-- Header -->
      <div class="nfc-modal-header">
        <div class="nfc-modal-icon-ring">
          <i class="fa-solid fa-tag"></i>
        </div>
        <div>
          <h2 class="nfc-modal-title">Định danh Thẻ NFC</h2>
          <p class="nfc-modal-subtitle">Cây: <strong id="nfc-modal-plant-name">...</strong></p>
        </div>
        <button class="modal-close-btn" onclick="closeNfcModal()" aria-label="Đóng">×</button>
      </div>

      <!-- Current UID -->
      <div class="nfc-current-uid-row">
        <span class="nfc-uid-label"><i class="fa-solid fa-id-card"></i> Thẻ hiện tại:</span>
        <span id="nfc-modal-current-uid"></span>
      </div>

      <!-- Hierarchical Public Plant URL Box: domain / <user_id> / <farm_id> / <plant_id> / <nfc_uid> -->
      <div id="nfc-public-url-wrap" style="margin: 12px 0; padding: 12px; background: #f0fdf4; border: 1.5px solid #86efac; border-radius: 12px;">
        <div style="font-size: 11px; font-weight: 700; color: #166534; text-transform: uppercase; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;">
          <span><i class="fa-solid fa-link"></i> Đường dẫn Trang Cây Công khai chuẩn:</span>
          <span style="font-size: 10px; color: #15803d; background: #dcfce7; padding: 2px 8px; border-radius: 6px; font-weight:700;">Liên kết ghi vào thẻ NFC</span>
        </div>
        
        <!-- URL Input & Buttons -->
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
          <input type="text" id="nfc-public-url-input" readonly style="flex: 1; padding: 8px 12px; font-size: 12px; font-family: monospace; background: #ffffff; border: 1px solid #94a3b8; border-radius: 8px; color: #0f172a; font-weight: 600;" value="...">
          <button class="btn btn-secondary btn-xs" onclick="copyNfcPublicUrl()" title="Sao chép link" style="white-space: nowrap; padding: 6px 12px; font-size: 12px; height:34px; border-radius: 8px;">
            <i class="fa-regular fa-copy"></i> Copy
          </button>
          <a id="nfc-public-url-link" href="#" target="_blank" class="btn btn-primary btn-xs" title="Mở trang công khai" style="white-space: nowrap; padding: 6px 12px; font-size: 12px; text-decoration: none; height:34px; display:inline-flex; align-items:center; gap:4px; border-radius: 8px;">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Mở
          </a>
        </div>

        <!-- Component ID Parameters breakdown -->
        <div style="display:flex; gap:6px; flex-wrap:wrap; font-size:11px;">
          <span class="badge" style="background:#dcfce7; color:#14532d; font-weight:600;"><i class="fa-solid fa-user"></i> ID Nông hộ: <strong id="nfc-meta-user-id">#--</strong></span>
          <span class="badge" style="background:#dcfce7; color:#14532d; font-weight:600;"><i class="fa-solid fa-warehouse"></i> ID Vườn: <strong id="nfc-meta-farm-id">#--</strong></span>
          <span class="badge" style="background:#dcfce7; color:#14532d; font-weight:600;"><i class="fa-solid fa-seedling"></i> ID Cây: <strong id="nfc-meta-plant-id">#--</strong></span>
          <span class="badge" style="background:#dcfce7; color:#14532d; font-weight:600;"><i class="fa-solid fa-tag"></i> ID Mã Thẻ: <strong id="nfc-meta-tag-id">Chưa gắn</strong></span>
        </div>
      </div>

      <!-- Scan Area -->
      <div class="nfc-scan-area">
        <div class="nfc-scan-icon-wrap">
          <i id="nfc-scan-icon" class="fa-solid fa-wifi" style="color:#6b7280"></i>
        </div>
        <p id="nfc-scan-label" class="nfc-scan-label">Nhấn "Bắt đầu quét" để chạm thẻ</p>
        <button id="nfc-start-scan-btn" class="btn btn-primary nfc-scan-btn" onclick="startNfcScan()">
          <i class="fa-solid fa-rss"></i> Bắt đầu quét NFC
        </button>
      </div>

      <!-- Divider -->
      <div class="nfc-divider"><span>hoặc nhập thủ công</span></div>

      <!-- Manual Input -->
      <div class="nfc-manual-section">
        <label class="nfc-input-label"><i class="fa-solid fa-keyboard"></i> Nhập mã thẻ (UID)</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="nfc-manual-uid" placeholder="Ví dụ: 04:AB:12:CD:EF:34" class="nfc-manual-input"
            onkeydown="if(event.key==='Enter') saveNfcUidManually()">
          <button class="btn btn-primary" onclick="saveNfcUidManually()" style="white-space:nowrap;">
            <i class="fa-solid fa-floppy-disk"></i> Lưu
          </button>
        </div>
        <p style="font-size:11px; color:var(--gray-400); margin-top:6px;">
          <i class="fa-solid fa-circle-info"></i> Mã UID thường được in trên mặt thẻ hoặc do phần mềm đọc thẻ cung cấp.
        </p>
      </div>

      <!-- Deactivate -->
      <button id="nfc-deactivate-btn" class="nfc-deactivate-btn" onclick="deactivateNfcTag()" style="display:none;">
        <i class="fa-solid fa-ban"></i> Hủy kích hoạt thẻ hiện tại
      </button>

      <!-- Footer -->
      <div class="nfc-modal-footer">
        <button class="btn btn-secondary" onclick="closeNfcModal()">
          <i class="fa-solid fa-xmark"></i> Đóng
        </button>
      </div>
    </div>
  </div>

<!-- ════════════ CARE MODAL ════════════ -->
