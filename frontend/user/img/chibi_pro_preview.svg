<svg width="200" height="220" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyLight" cx="38%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <radialGradient id="tummyLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </radialGradient>
    <radialGradient id="eyeIris" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="leafGrad" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Cute Seed/Sprout Antennae on Head -->
  <g transform="translate(0, 5)">
    <path d="M100 52 C95 24 68 20 74 38 C78 50 94 48 100 52Z" fill="url(#leafGrad)" filter="url(#shadow)" />
    <path d="M100 52 C105 24 132 20 126 38 C122 50 106 48 100 52Z" fill="url(#leafGrad)" filter="url(#shadow)" />
    <circle cx="100" cy="28" r="4" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- Chubby Pear-shaped Sprout Body -->
  <path d="M100 50 C145 50 162 95 158 135 C154 175 130 190 100 190 C70 190 46 175 42 135 C38 95 55 50 100 50Z" fill="url(#bodyLight)" filter="url(#shadow)" />

  <!-- Soft Creamy Belly -->
  <ellipse cx="100" cy="142" rx="40" ry="36" fill="url(#tummyLight)" opacity="0.9" />

  <!-- Big Sparkling Anime Left Eye -->
  <g transform="translate(72, 102)">
    <!-- White Eye Base -->
    <ellipse cx="0" cy="0" rx="14" ry="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <!-- Blue-Green Gradient Iris -->
    <ellipse cx="1" cy="1" rx="11" ry="15" fill="url(#eyeIris)" />
    <!-- Dark Pupil -->
    <ellipse cx="1" cy="2" rx="7" ry="10" fill="#020617" />
    <!-- Big Anime Sparkle Highlight -->
    <circle cx="-3" cy="-5" r="5" fill="#ffffff" />
    <!-- Small Anime Sparkle Highlight -->
    <circle cx="4" cy="6" r="2.5" fill="#ffffff" />
    <!-- Eyelash / Eyelid -->
    <path d="M-14 -12 Q0 -22 14 -12" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Big Sparkling Anime Right Eye -->
  <g transform="translate(128, 102)">
    <!-- White Eye Base -->
    <ellipse cx="0" cy="0" rx="14" ry="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <!-- Blue-Green Gradient Iris -->
    <ellipse cx="-1" cy="1" rx="11" ry="15" fill="url(#eyeIris)" />
    <!-- Dark Pupil -->
    <ellipse cx="-1" cy="2" rx="7" ry="10" fill="#020617" />
    <!-- Big Anime Sparkle Highlight -->
    <circle cx="-5" cy="-5" r="5" fill="#ffffff" />
    <!-- Small Anime Sparkle Highlight -->
    <circle cx="2" cy="6" r="2.5" fill="#ffffff" />
    <!-- Eyelash / Eyelid -->
    <path d="M-14 -12 Q0 -22 14 -12" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Soft Anime Rosy Cheeks -->
  <ellipse cx="58" cy="122" rx="10" ry="6" fill="#fb7185" opacity="0.55" />
  <ellipse cx="142" cy="122" rx="10" ry="6" fill="#fb7185" opacity="0.55" />

  <!-- Sweet Smiling Mouth -->
  <path d="M93 124 Q100 134 107 124" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round" fill="#fda4af" />

  <!-- Tiny Cute Chubby Hands -->
  <circle cx="46" cy="145" r="9" fill="#34d399" stroke="#059669" stroke-width="1.5" />
  <circle cx="154" cy="145" r="9" fill="#34d399" stroke="#059669" stroke-width="1.5" />

  <!-- Tiny Cute Boots/Feet -->
  <ellipse cx="82" cy="190" rx="12" ry="8" fill="#d97706" stroke="#78350f" stroke-width="1.5" />
  <ellipse cx="118" cy="190" rx="12" ry="8" fill="#d97706" stroke="#78350f" stroke-width="1.5" />
</svg>
