<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mapbox GIS Vệ Tinh</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; }
    
    .target-marker {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: #22C55E;
      border: 2px solid white;
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.35);
      animation: pulse 1.6s infinite alternate;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 11px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .target-marker.sick {
      background-color: #EF4444;
      box-shadow: 0 0 0 5px rgba(239, 68, 68, 0.35);
    }
    .target-marker.warn {
      background-color: #F59E0B;
      box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.35);
    }
    
    @keyframes pulse {
      0% { transform: scale(0.92); box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.3); }
      100% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
    }
    .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Extract slug from URL /plant/:slug/map
    const pathSegments = window.location.pathname.split('/');
    const slugIndex = pathSegments.indexOf('plant') + 1;
    const slug = pathSegments[slugIndex];

    async function initMap() {
      try {
        // Fetch mapbox token
        const tokenRes = await fetch('/api/config/mapbox-token');
        const tokenData = await tokenRes.json();
        const mapboxToken = tokenData.token;
        if (!mapboxToken) throw new Error("Mapbox token not loaded");
        
        mapboxgl.accessToken = mapboxToken;

        // Fetch plant details
        const plantRes = await fetch('/api/plants/public/' + slug);
        if (!plantRes.ok) throw new Error("Failed to load plant info");
        const plantData = await plantRes.json();

        const lat = parseFloat(plantData.latitude);
        const lng = parseFloat(plantData.longitude);
        const health = plantData.health_status || 'Tốt';
        const treeCode = plantData.tree_code || plantData.id.toString();

        const map = new mapboxgl.Map({
          container: 'map',
          style: 'mapbox://styles/mapbox/satellite-streets-v12', // Satellite streets
          center: (lng && lat) ? [lng, lat] : [108.2, 12.0],
          zoom: 17.5,
          attributionControl: false
        });

        map.addControl(new mapboxgl.NavigationControl({ showCompass: true }), 'top-right');

        // Location tracker
        const geolocate = new mapboxgl.GeolocateControl({
          positionOptions: {
            enableHighAccuracy: true
          },
          trackUserLocation: true,
          showUserHeading: true
        });
        map.addControl(geolocate, 'top-right');

        map.on('load', () => {
          addContourLinesToMap(map);
          setTimeout(() => {
            try { geolocate.trigger(); } catch (e) {}
          }, 800);

          // Draw farm polygon coordinates
          let poly = [];
          if (plantData.farm_polygon) {
            try {
              const parsed = typeof plantData.farm_polygon === 'string'
                ? JSON.parse(plantData.farm_polygon)
                : plantData.farm_polygon;
              
              if (parsed && parsed.length > 0) {
                if (Array.isArray(parsed[0]) && Array.isArray(parsed[0][0])) {
                  poly = [...parsed[0]];
                } else {
                  poly = [...parsed];
                }
              }
            } catch (e) {
              console.error("Error parsing farm polygon:", e);
            }
          }

          if (poly.length > 0) {
            if (poly[0][0] !== poly[poly.length - 1][0] || poly[0][1] !== poly[poly.length - 1][1]) {
              poly.push(poly[0]);
            }

            map.addSource('farm-boundary', {
              'type': 'geojson',
              'data': {
                'type': 'Feature',
                'geometry': {
                  'type': 'Polygon',
                  'coordinates': [poly]
                }
              }
            });

            map.addLayer({
              'id': 'farm-fill',
              'type': 'fill',
              'source': 'farm-boundary',
              'layout': {},
              'paint': {
                'fill-color': '#22C55E',
                'fill-opacity': 0.12
              }
            });

            map.addLayer({
              'id': 'farm-outline',
              'type': 'line',
              'source': 'farm-boundary',
              'layout': {},
              'paint': {
                'line-color': '#22C55E',
                'line-width': 2.5
              }
            });
          }

          // Add plant marker
          if (lng && lat) {
            const el = document.createElement('div');
            el.className = 'target-marker';
            if (health === 'Bệnh') el.className += ' sick';
            if (health === 'Cần chú ý') el.className += ' warn';
            el.innerText = treeCode;

            new mapboxgl.Marker({ element: el })
              .setLngLat([lng, lat])
              .addTo(map);
          }
        });
      } catch (err) {
        console.error(err);
      }
    }

      function addContourLinesToMap(map, options = {}) {
        if (!map) return;
        const defaultVisible = options.defaultVisible !== false;
        const showControl = options.showControl !== false;

        const initContours = () => {
          try {
            if (!map.getSource('mapbox-dem')) {
              map.addSource('mapbox-dem', {
                type: 'raster-dem',
                url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
                tileSize: 512,
                maxzoom: 14
              });
              map.setTerrain({ source: 'mapbox-dem', exaggeration: 1.5 });
            }

            if (!map.getSource('mapbox-terrain-contours')) {
              map.addSource('mapbox-terrain-contours', {
                type: 'vector',
                url: 'mapbox://mapbox.mapbox-terrain-v2'
              });
            }

            const contourColorRamp = [
              'interpolate',
              ['linear'],
              ['get', 'ele'],
              0,    '#1d4ed8',
              100,  '#0284c7',
              300,  '#06b6d4',
              450,  '#10b981',
              490,  '#22c55e',
              500,  '#84cc16',
              504,  '#eab308',
              508,  '#f97316',
              512,  '#ef4444',
              800,  '#dc2626',
              1500, '#991b1b'
            ];

            if (!map.getLayer('contour-lines')) {
              map.addLayer({
                id: 'contour-lines',
                type: 'line',
                source: 'mapbox-terrain-contours',
                'source-layer': 'contour',
                layout: {
                  'line-join': 'round',
                  'line-cap': 'round',
                  'visibility': defaultVisible ? 'visible' : 'none'
                },
                paint: {
                  'line-color': contourColorRamp,
                  'line-width': [
                    'interpolate',
                    ['exponential', 1.5],
                    ['zoom'],
                    11, 0.6,
                    14, 1.4,
                    17, 2.8
                  ],
                  'line-opacity': 0.9
                }
              });
            }

            if (!map.getLayer('contour-labels')) {
              map.addLayer({
                id: 'contour-labels',
                type: 'symbol',
                source: 'mapbox-terrain-contours',
                'source-layer': 'contour',
                layout: {
                  'symbol-placement': 'line',
                  'text-field': ['concat', ['get', 'ele'], ' m'],
                  'text-size': [
                    'interpolate',
                    ['linear'],
                    ['zoom'],
                    12, 9,
                    16, 12
                  ],
                  'text-allow-overlap': false,
                  'text-ignore-placement': false,
                  'text-max-angle': 35,
                  'visibility': defaultVisible ? 'visible' : 'none'
                },
                paint: {
                  'text-color': contourColorRamp,
                  'text-halo-color': 'rgba(0, 0, 0, 0.9)',
                  'text-halo-width': 2
                }
              });
            }

            if (showControl && !map._contourControlAdded) {
              map._contourControlAdded = true;

              class ContourToggleControl {
                onAdd(m) {
                  this._map = m;
                  this._container = document.createElement('div');
                  this._container.className = 'mapboxgl-ctrl mapboxgl-ctrl-group';
                  
                  const btn = document.createElement('button');
                  btn.className = 'mapboxgl-ctrl-icon mapbox-ctrl-contour-btn';
                  btn.type = 'button';
                  btn.title = 'Bật/Tắt đường đồng mức mật độ cao (Contour Lines)';
                  btn.setAttribute('aria-label', 'Toggle Contour Lines');
                  btn.style.cssText = `
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    width: 29px;
                    height: 29px;
                    font-size: 13px;
                    font-weight: bold;
                    background: ${defaultVisible ? 'rgba(245, 158, 11, 0.25)' : 'transparent'};
                    color: ${defaultVisible ? '#f59e0b' : '#555'};
                    border: none;
                    cursor: pointer;
                  `;
                  btn.innerHTML = '⛰️';

                  let isVisible = defaultVisible;

                  btn.onclick = () => {
                    isVisible = !isVisible;
                    const visVal = isVisible ? 'visible' : 'none';
                    if (m.getLayer('contour-lines')) m.setLayoutProperty('contour-lines', 'visibility', visVal);
                    if (m.getLayer('contour-labels')) m.setLayoutProperty('contour-labels', 'visibility', visVal);

                    btn.style.background = isVisible ? 'rgba(245, 158, 11, 0.25)' : 'transparent';
                    btn.style.color = isVisible ? '#f59e0b' : '#555';

                    const legendEl = m.getContainer().querySelector('.elevation-legend-widget');
                    if (legendEl) legendEl.style.display = isVisible ? 'flex' : 'none';
                  };

                  this._container.appendChild(btn);
                  return this._container;
                }

                onRemove() {
                  if (this._container && this._container.parentNode) {
                    this._container.parentNode.removeChild(this._container);
                  }
                  this._map = undefined;
                }
              }

              map.addControl(new ContourToggleControl(), 'top-right');

              const mapContainer = map.getContainer();
              if (mapContainer && !mapContainer.querySelector('.elevation-legend-widget')) {
                const legend = document.createElement('div');
                legend.className = 'elevation-legend-widget';
                legend.style.cssText = `
                  position: absolute;
                  bottom: 24px;
                  right: 10px;
                  z-index: 8;
                  background: rgba(7, 25, 16, 0.88);
                  backdrop-filter: blur(10px);
                  -webkit-backdrop-filter: blur(10px);
                  border: 1px solid rgba(255, 255, 255, 0.15);
                  border-radius: 10px;
                  padding: 8px 10px;
                  color: #fff;
                  font-size: 11px;
                  display: ${defaultVisible ? 'flex' : 'none'};
                  flex-direction: column;
                  align-items: center;
                  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
                  pointer-events: none;
                `;
                legend.innerHTML = `
                  <div style="font-weight:700; margin-bottom:6px; font-size:10px; text-transform:uppercase; color:#9ca3af; letter-spacing:0.5px;">Cao độ (m)</div>
                  <div style="display:flex; align-items:center; gap:8px;">
                    <div style="
                      width: 10px;
                      height: 110px;
                      border-radius: 5px;
                      background: linear-gradient(to top, #1d4ed8, #06b6d4, #10b981, #84cc16, #eab308, #f97316, #ef4444);
                      border: 1px solid rgba(255,255,255,0.3);
                    "></div>
                    <div style="display:flex; flex-direction:column; justify-content:space-between; height:110px; font-size:9px; font-weight:700; color:#e5e7eb;">
                      <span style="color:#ef4444;">Cao ▲</span>
                      <span style="color:#eab308;">TB</span>
                      <span style="color:#06b6d4;">Thấp ▼</span>
                    </div>
                  </div>
                `;
                mapContainer.appendChild(legend);
              }
            }
          } catch (err) {
            console.warn('Cảnh báo hiển thị đường đồng mức:', err);
          }
        };

        if (map.isStyleLoaded()) {
          initContours();
        } else {
          map.once('load', initContours);
        }
      }

    initMap();
  </script>
</body>
</html>
