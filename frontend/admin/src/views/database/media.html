<div class="tab-pane" id="db-pane-media" style="display:none;">
          <div class="card">
            <div class="card-header" style="flex-wrap: wrap; gap: 10px;">
              <h3 style="display: flex; align-items: center; gap: 8px; margin: 0;">
                <i data-lucide="film" class="lucide-sm" style="color:var(--blue)"></i> Thư viện Media & Quản lý Thư mục Trang trại
              </h3>
            </div>

            <div style="padding: 12px 16px; background: #ecfdf5; border-bottom: 1px solid #a7f3d0; font-size: 13px; font-weight: 700; color: #064e3b; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;" id="media-breadcrumb-nav">
              <span style="color:#059669; cursor:pointer;" onclick="navigateToMediaFolder('root')"><i data-lucide="folder" class="lucide-sm"></i> Thư viện gốc</span>
            </div>

            <div style="padding: 20px;">
              <div id="media-folders-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px;">
              </div>

              <div id="media-gallery-grid" class="media-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px;">
              </div>

              <div id="media-gallery-empty" style="display: none; text-align: center; padding: 40px; color: var(--gray-400);">
                <i data-lucide="folder-open" class="lucide-sm" style="font-size: 48px; margin-bottom: 12px; display: block; color:#94a3b8;"></i>
                Chưa có thư mục hoặc phương tiện nào trong cấp này.
              </div>
            </div>
          </div>
        </div>
