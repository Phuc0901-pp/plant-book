<!-- ════════════ USER MODAL ════════════ -->
<div class="modal-overlay" id="user-modal" style="display:none" onclick="if(event.target===this)closeUserModal()">
  <div class="modal" style="max-width: 480px;">
    <div class="modal-header">
      <h2 id="user-modal-title"><i class="fa-solid fa-user-plus" style="color:var(--green)"></i> Thêm người dùng mới</h2>
      <button class="modal-close" onclick="closeUserModal()">×</button>
    </div>
    <div class="modal-body">
      <form id="f-user-form" onsubmit="return false;">
      <input type="hidden" id="f-user-id">
      
      <div class="field">
        <label>Họ và tên *</label>
        <input type="text" id="f-user-name" placeholder="VD: Nguyễn Văn A, Trần Thị B...">
      </div>
      
      <div class="field">
        <label>Email *</label>
        <input type="email" id="f-user-email" placeholder="VD: farmer@tanbaocorp.vn..." autocomplete="username">
      </div>
      
      <div class="field">
        <label id="f-user-pass-label">Mật khẩu *</label>
        <input type="password" id="f-user-pass" placeholder="••••••••" autocomplete="new-password">
        <small id="f-user-pass-help" style="display:none; font-size:11px; color:var(--gray-400); margin-top:4px;">
          Để trống nếu không muốn thay đổi mật khẩu
        </small>
      </div>
      
      <div class="field">
        <label>Vai trò *</label>
        <select id="f-user-role" style="width:100%; padding:10px 12px; border:1.5px solid var(--gray-200); border-radius:8px;">
          <option value="user">Người dùng / Nông hộ</option>
          <option value="admin">Quản trị viên</option>
        </select>
      </div>

      <div class="field">
        <label><i class="fa-solid fa-earth-asia" style="color:var(--green)"></i> Gắn vào Trang trại đã khởi tạo</label>
        <select id="f-user-farm-id" style="width:100%; padding:10px 12px; border:1.5px solid var(--gray-200); border-radius:8px;">
          <option value="">— Chưa gán trang trại nào —</option>
        </select>
        <small style="font-size:11px; color:var(--gray-500); margin-top:4px; display:block;">
          💡 Nhiều nông dân có thể gán vào cùng 1 trang trại để đồng bộ quản lý thực địa.
        </small>
      </div>

      <!-- Cấu hình Phân quyền xem dữ liệu riêng cá nhân -->
      <div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:14px; margin-top:14px;">
        <div style="font-size:12px; font-weight:700; color:#0f172a; margin-bottom:10px; display:flex; align-items:center; gap:6px;">
          <i class="fa-solid fa-user-gear" style="color:var(--green)"></i> Cấu hình Quyền xem dữ liệu cho Nông hộ này:
        </div>

        <div class="field" style="margin-bottom:10px;">
          <label style="font-size:11.5px; font-weight:600; color:#334155;">Phạm vi Cây trồng được xem</label>
          <select id="f-user-plants-scope" onchange="toggleAssignedPlantsPicker()" style="width:100%; padding:8px 10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:12px;">
            <option value="all">🌳 Xem toàn bộ cây trồng trong trang trại</option>
            <option value="assigned">👤 Chỉ xem cây trồng do cá nhân phụ trách</option>
          </select>
          
          <!-- Danh sách cây trồng gán thủ công cho Nông hộ này -->
          <div id="assigned-plants-picker-container" style="display:none; margin-top:8px; background:#fff; border:1.5px solid #bbf7d0; border-radius:8px; padding:10px;">
            <label style="font-size:11px; font-weight:700; color:#047857; margin-bottom:6px; display:block;">
              🌱 Tích chọn danh sách cây giao riêng cho Nông hộ này:
            </label>
            <div id="assigned-plants-checkboxes" style="max-height:150px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; font-size:11.5px;">
              <!-- Filled dynamically by JS -->
            </div>
          </div>
        </div>


        <div class="field" style="margin-bottom:10px;">
          <label style="font-size:11.5px; font-weight:600; color:#334155;">Chỉ được xem Lịch sử & Nhật ký từ ngày</label>
          <input type="date" id="f-user-history-date" style="width:100%; padding:8px 10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:12px;">
          <small style="font-size:10.5px; color:#64748b; margin-top:3px; display:block;">💡 Để trống nếu muốn cho xem toàn bộ lịch sử từ trước tới nay.</small>
        </div>

        <label style="display:flex; align-items:center; gap:8px; font-size:11.5px; color:#334155; margin-bottom:6px; cursor:pointer;">
          <input type="checkbox" id="f-user-shared-history" checked style="width:16px; height:16px; accent-color:var(--green);">
          <span>📖 Được xem Nhật ký canh tác của các Nông hộ khác trong vườn</span>
        </label>

        <label style="display:flex; align-items:center; gap:8px; font-size:11.5px; color:#334155; cursor:pointer;">
          <input type="checkbox" id="f-user-view-supplies" checked style="width:16px; height:16px; accent-color:var(--green);">
          <span>📦 Được xem Vật tư hiện hữu & Tồn kho chung của trang trại</span>
        </label>
      </div>
      </form>
    </div>


    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeUserModal()">Hủy</button>
      <button class="btn btn-primary" id="user-save-btn" onclick="saveUser()">
        <span id="user-save-text"><i class="fa fa-floppy-disk"></i> Lưu người dùng</span>
      </button>
    </div>
  </div>
</div>
