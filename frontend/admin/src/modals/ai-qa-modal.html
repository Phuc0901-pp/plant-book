<!-- ════════════════ MODAL: THÊM / SỬA CẶP Q&A HUẤN LUYỆN ════════════════ -->
<div class="modal" id="ai-qa-modal" style="display:none;">
  <div class="modal-backdrop" onclick="closeAiQaModal()"></div>
  <div class="modal-dialog" style="max-width:640px; width:95%; background:#ffffff; border-radius:18px; overflow:hidden; box-shadow:0 15px 40px rgba(0,0,0,0.2); z-index:1050; position:relative; margin:auto;">
    
    <!-- Modal Header -->
    <div style="background:linear-gradient(135deg, #0369a1 0%, #0284c7 100%); color:#ffffff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:20px;"><i class="fa-solid fa-comments"></i></span>
        <h3 style="margin:0; font-size:16.5px; font-weight:800; color:#ffffff;" id="ai-qa-modal-title">
          Thêm Cặp Q&amp;A Huấn Luyện Mới
        </h3>
      </div>
      <button type="button" onclick="closeAiQaModal()" style="background:none; border:none; color:#ffffff; font-size:18px; cursor:pointer; opacity:0.8;">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Modal Form Body -->
    <form id="ai-qa-form" onsubmit="saveAiQaPair(event)" style="padding:22px; display:flex; flex-direction:column; gap:16px; margin:0;">
      <input type="hidden" id="ai-qa-id" value="">

      <!-- 🛡️ HONEYPOT FIELD (Bẫy Bot) -->
      <div style="display:none !important;" aria-hidden="true">
        <input type="text" name="hp_security_trap" id="ai-qa-hp-trap" tabindex="-1" autocomplete="off" value="">
      </div>

      <div style="display:grid; grid-template-columns:2fr 1fr; gap:14px;">
        <!-- Phân loại -->
        <div>
          <label style="display:block; font-size:12.5px; font-weight:700; color:#334155; margin-bottom:6px;">
            Phân Loại <span style="color:#dc2626;">*</span>
          </label>
          <select id="ai-qa-category" required style="width:100%; padding:9px 12px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:13px; background:#ffffff; outline:none;">
            <option value="An toàn Sinh học">An toàn Sinh học</option>
            <option value="Sâu bệnh hại">Sâu bệnh hại</option>
            <option value="Kỹ thuật Canh tác">Kỹ thuật Canh tác</option>
            <option value="Cẩm nang Ứng dụng">Cẩm nang Ứng dụng</option>
          </select>
        </div>

        <!-- Trạng thái -->
        <div>
          <label style="display:block; font-size:12.5px; font-weight:700; color:#334155; margin-bottom:6px;">
            Trạng Thái
          </label>
          <label style="display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px; cursor:pointer; font-weight:600; color:#0f172a;">
            <input type="checkbox" id="ai-qa-active" checked style="width:16px; height:16px; accent-color:#0284c7;"> Kích hoạt
          </label>
        </div>
      </div>

      <!-- Các mẫu câu hỏi -->
      <div>
        <label style="display:block; font-size:12.5px; font-weight:700; color:#334155; margin-bottom:4px;">
          Các Mẫu Câu Hỏi Tương Tự (Mỗi câu hỏi cách nhau 1 dòng) <span style="color:#dc2626;">*</span>
        </label>
        <span style="display:block; font-size:11.5px; color:#64748b; margin-bottom:6px;">
          💡 Ví dụ: Khi người dùng gõ bất kỳ câu nào trong danh sách này, Bé Mầm sẽ nhận diện và áp dụng câu trả lời chuẩn ngay lập tức.
        </span>
        <textarea id="ai-qa-questions" rows="4" required placeholder="vừa xịt thuốc nấm tưới vi sinh được không&#10;xịt thuốc sâu xong bón trichoderma liền được không&#10;khoảng cách giữa thuốc trừ bệnh và men vi sinh" style="width:100%; padding:10px 12px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:13px; font-family:inherit; outline:none; resize:vertical; line-height:1.5;" onfocus="this.style.borderColor='#0284c7'" onblur="this.style.borderColor='#cbd5e1'"></textarea>
      </div>

      <!-- Câu trả lời chuẩn xác của Tân Bảo -->
      <div>
        <label style="display:block; font-size:12.5px; font-weight:700; color:#334155; margin-bottom:6px;">
          Câu Trả Lời Chuẩn Xác Của Bé Mầm <span style="color:#dc2626;">*</span>
        </label>
        <textarea id="ai-qa-answer" rows="5" required placeholder="Nhập câu trả lời chi tiết, xưng hô 'Dạ Bác', giải thích lý do rõ ràng và hướng dẫn từng bước..." style="width:100%; padding:10px 12px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:13px; font-family:inherit; outline:none; resize:vertical; line-height:1.5;" onfocus="this.style.borderColor='#0284c7'" onblur="this.style.borderColor='#cbd5e1'"></textarea>
      </div>

      <!-- Từ khóa phụ -->
      <div>
        <label style="display:block; font-size:12.5px; font-weight:700; color:#334155; margin-bottom:6px;">
          Từ Khóa Gợi Nhớ (Tùy chọn)
        </label>
        <input type="text" id="ai-qa-keywords" placeholder="Ví dụ: cách ly 10 ngày, vi sinh, thuốc trừ bệnh..." style="width:100%; padding:9px 12px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:13px; outline:none;">
      </div>

      <!-- Footer Buttons -->
      <div style="display:flex; justify-content:flex-end; gap:10px; border-top:1px solid #f1f5f9; padding-top:16px; margin-top:4px;">
        <button type="button" class="btn btn-outline" onclick="closeAiQaModal()" style="font-size:13px; font-weight:700; padding:8px 16px; border-radius:8px;">
          Hủy Bỏ
        </button>
        <button type="submit" id="btn-save-ai-qa" class="btn btn-secondary" style="font-size:13px; font-weight:800; padding:8px 20px; border-radius:8px; background:#0284c7; color:#ffffff; border:none; box-shadow:0 3px 10px rgba(2,132,199,0.25);">
          <i class="fa-solid fa-floppy-disk"></i> Lưu Cặp Q&amp;A
        </button>
      </div>
    </form>

  </div>
</div>
