version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════
  # 1. POSTGRESQL 16 ENTERPRISE DATABASE FOR NAS
  # ═══════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: tanbao-postgres-nas
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: plant_book
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tanbao_secure_password_2026
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Mount trực tiếp vào thư mục lưu trữ của NAS (hoặc volume Docker)
      - ./nas_storage/postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      postgres -c max_connections=200
               -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c maintenance_work_mem=128MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c random_page_cost=1.1
               -c effective_io_concurrency=200
               -c work_mem=13107kB
               -c min_wal_size=1GB
               -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plant_book"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════
  # 2. REDIS 7 IN-MEMORY CACHE FOR NAS
  # ═══════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: tanbao-redis-nas
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server --requirepass tanbao_redis_pass_2026
                   --appendonly yes
                   --maxmemory 256mb
                   --maxmemory-policy allkeys-lru
    volumes:
      - ./nas_storage/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tanbao_redis_pass_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════
  # 3. PGADMIN 4 — GIAO DIỆN QUẢN TRỊ CSDL TRỰC QUAN TRÊN TRÌNH DUYỆT
  # ═══════════════════════════════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tanbao-pgadmin-nas
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tanbaocorp.vn
      PGADMIN_DEFAULT_PASSWORD: admin_nas_password_2026
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - ./nas_storage/pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
